server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  # Served both at / (port 8443) and under /ledger/ (tailscale serve path); strip the prefix if present.
  rewrite ^/ledger$ /ledger/ permanent;
  rewrite ^/ledger/(.*)$ /$1 last;

  location /api/ {
    proxy_pass http://ledger_bridge:8080;
    proxy_read_timeout 120s;
  }
  # no-cache = always revalidate (cheap 304 via ETag), so a new build shows up on the next load.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
